name: Deploy Staging

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".understand-anything/**"
  workflow_dispatch:

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}

jobs:
  verify:
    name: Verify staging candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    name: Build immutable staging image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image coordinates
        shell: bash
        run: |
          REGION="$(printf '%s' "${AWS_REGION}" | tr -d '\r\n')"
          REGISTRY="$(printf '%s' "${ECR_REGISTRY}" | tr -d '\r\n' | sed 's#/*$##')"
          REPOSITORY="$(printf '%s' "${ECR_REPOSITORY}" | tr -d '\r\n' | sed 's#^/*##; s#/*$##')"
          if [ -z "${REGION}" ] || [ -z "${REGISTRY}" ] || [ -z "${REPOSITORY}" ]; then
            echo "AWS_DEFAULT_REGION, AWS_ECR_REGISTRY, and AWS_ECR_REPOSITORY are required." >&2
            exit 1
          fi
          IMAGE="${REGISTRY}/${REPOSITORY}"
          {
            echo "AWS_REGION=${REGION}"
            echo "ECR_REGISTRY=${REGISTRY}"
            echo "ECR_REPOSITORY=${REPOSITORY}"
            echo "IMAGE=${IMAGE}"
          } >> "$GITHUB_ENV"

      - name: Build and push Docker image
        shell: bash
        run: |
          docker buildx build \
            --file ./Dockerfile \
            --target runner \
            --cache-from type=gha,scope=staging \
            --cache-to type=gha,scope=staging,mode=min \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --push \
            .

  deploy:
    name: Deploy immutable image to staging VPS
    runs-on: ubuntu-latest
    needs: [verify, build-and-push]
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          port: ${{ secrets.STAGING_VPS_PORT }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.STAGING_APP_DIR }}"
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "${{ github.sha }}"
            PREVIOUS_APP_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q app)" 2>/dev/null || true)"
            export AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}"
            export AWS_ECR_REGISTRY="${{ secrets.AWS_ECR_REGISTRY }}"
            export AWS_ECR_REPOSITORY="${{ secrets.AWS_ECR_REPOSITORY }}"
            export AWS_DEFAULT_REGION="$(printf '%s' "$AWS_DEFAULT_REGION" | tr -d '\r\n')"
            export AWS_ECR_REGISTRY="$(printf '%s' "$AWS_ECR_REGISTRY" | tr -d '\r\n' | sed 's#/*$##')"
            export AWS_ECR_REPOSITORY="$(printf '%s' "$AWS_ECR_REPOSITORY" | tr -d '\r\n' | sed 's#^/*##; s#/*$##')"
            export APP_IMAGE="${AWS_ECR_REGISTRY}/${AWS_ECR_REPOSITORY}:${{ github.sha }}"
            export DEPLOY_BRANCH="${{ github.ref_name }}"
            export DEPLOY_SKIP_GIT_SYNC="true"
            export DEPLOY_ROLLBACK_IMAGE="$PREVIOUS_APP_IMAGE"
            export DEPLOY_CREATE_BACKUP="true"
            export DEPLOY_PRUNE_IMAGES="true"
            bash scripts/deploy.sh
