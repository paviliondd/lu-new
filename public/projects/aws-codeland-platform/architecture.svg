<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">CodeLand AWS platform topology and delivery flow</title><desc id="desc">CloudFront serves an S3 React frontend and forwards API traffic to an ALB. The ALB reaches private EC2 Auto Scaling instances connected to private RDS. CloudFormation and AMI Builder deliver backend images.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#93c5fd"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#eff6ff}.box{fill:#142b49;stroke:#60a5fa;stroke-width:2;rx:14}.data{fill:#173b39;stroke:#34d399;stroke-width:2;rx:14}.ops{fill:#332448;stroke:#c084fc;stroke-width:2;rx:14}.muted{fill:#a9bdd3;font-size:16px}.label{font-size:20px;font-weight:700}.small{font-size:15px}.flow{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#c084fc;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1400" height="820" fill="#09111e"/><text x="50" y="50" font-size="31" font-weight="700">CodeLand.io — AWS three-tier delivery topology</text><text x="50" y="80" class="muted">Edge delivery and API routing are public; application compute and PostgreSQL remain private.</text>
<rect class="box" x="45" y="150" width="180" height="100"/><text x="135" y="190" text-anchor="middle" class="label">User</text><text x="135" y="220" text-anchor="middle" class="small">browser / SPA routes</text><rect class="box" x="285" y="150" width="205" height="100"/><text x="387" y="190" text-anchor="middle" class="label">CloudFront + WAF</text><text x="387" y="220" text-anchor="middle" class="small">HTTPS · /api/* behavior</text><rect class="data" x="550" y="105" width="210" height="90"/><text x="655" y="143" text-anchor="middle" class="label">S3 static site</text><text x="655" y="172" text-anchor="middle" class="small">React build artifacts</text><path class="flow" d="M225 200H285"/><path class="flow" d="M490 180H550"/>
<rect class="box" x="550" y="250" width="210" height="100"/><text x="655" y="290" text-anchor="middle" class="label">Public ALB</text><text x="655" y="320" text-anchor="middle" class="small">TLS / target health</text><path class="flow" d="M490 220H520V300H550"/>
<rect class="box" x="850" y="220" width="260" height="150"/><text x="980" y="263" text-anchor="middle" class="label">Private EC2 ASG</text><text x="980" y="295" text-anchor="middle" class="small">Launch Template ← AMI</text><text x="980" y="321" text-anchor="middle" class="small">Flask + Gunicorn</text><text x="980" y="347" text-anchor="middle" class="small">/api/users/ping</text><path class="flow" d="M760 300H850"/>
<rect class="data" x="1160" y="220" width="190" height="150"/><text x="1255" y="263" text-anchor="middle" class="label">Private RDS</text><text x="1255" y="295" text-anchor="middle" class="small">PostgreSQL 17</text><text x="1255" y="321" text-anchor="middle" class="small">Secrets Manager</text><text x="1255" y="347" text-anchor="middle" class="small">database subnet group</text><path class="flow" d="M1110 295H1160"/>
<rect class="ops" x="70" y="505" width="260" height="130"/><text x="200" y="545" text-anchor="middle" class="label">CloudFormation</text><text x="200" y="577" text-anchor="middle" class="small">network · security · DB</text><text x="200" y="603" text-anchor="middle" class="small">compute · ALB · static</text><rect class="ops" x="410" y="505" width="260" height="130"/><text x="540" y="545" text-anchor="middle" class="label">AMI Builder</text><text x="540" y="577" text-anchor="middle" class="small">Lambda / Step Functions</text><text x="540" y="603" text-anchor="middle" class="small">AMIId + PipelineArn</text><rect class="ops" x="750" y="505" width="260" height="130"/><text x="880" y="545" text-anchor="middle" class="label">GitHub Actions</text><text x="880" y="577" text-anchor="middle" class="small">OIDC → AWS IAM</text><text x="880" y="603" class="small" text-anchor="middle">build → publish → deploy</text><rect class="ops" x="1090" y="505" width="260" height="130"/><text x="1220" y="545" text-anchor="middle" class="label">Operations</text><text x="1220" y="577" text-anchor="middle" class="small">SSM · CloudWatch Agent</text><text x="1220" y="603" class="small" text-anchor="middle">encrypted gp3 snapshots</text><path class="dash" d="M200 505V450H540V505"/><path class="dash" d="M540 505V450H880V505"/><path class="dash" d="M880 505V450H1220V505"/><path class="dash" d="M540 505V430H980V370"/>
<text x="55" y="705" class="muted">VPC: 10.1.0.0/16 · public subnets → ALB · private app subnets → ASG · private DB subnets → RDS · NAT + S3 endpoint.</text><text x="55" y="742" class="muted">SPA fallback: CloudFront maps 403/404 to /index.html so client-side routes survive reload.</text></svg>