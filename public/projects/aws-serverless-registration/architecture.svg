<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">AWS serverless event registration flow</title><desc id="desc">A static frontend calls API Gateway and a registration Lambda. DynamoDB stores QUEUED, SQS buffers work, and a sender Lambda uses SES and SNS before updating SENT.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#f472b6"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#fff1f2}.box{fill:#341d32;stroke:#f472b6;stroke-width:2;rx:14}.data{fill:#183c3b;stroke:#34d399;stroke-width:2;rx:14}.ext{fill:#1f3150;stroke:#60a5fa;stroke-width:2;rx:14}.muted{fill:#d3b5c3;font-size:16px}.label{font-size:21px;font-weight:700}.small{font-size:16px}.flow{stroke:#f472b6;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#60a5fa;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1400" height="820" fill="#170e18"/><text x="55" y="50" font-size="31" font-weight="700">AWS Serverless Event Registration — asynchronous notification flow</text><text x="55" y="80" class="muted">Synchronous intake ends after DynamoDB + SQS; email and administrator notification happen in the worker.</text>
<rect class="ext" x="55" y="160" width="220" height="115"/><text x="165" y="201" text-anchor="middle" class="label">Amplify / S3</text><text x="165" y="232" text-anchor="middle" class="small">static HTML/CSS/JS</text><text x="165" y="256" text-anchor="middle" class="small">CloudFront delivery</text><rect class="ext" x="345" y="160" width="220" height="115"/><text x="455" y="201" text-anchor="middle" class="label">API Gateway</text><text x="455" y="232" text-anchor="middle" class="small">POST /register</text><text x="455" y="256" text-anchor="middle" class="small">CORS + REST</text><path class="flow" d="M275 218H345"/>
<rect class="box" x="635" y="140" width="250" height="155"/><text x="760" y="181" text-anchor="middle" class="label">Registration Lambda</text><text x="760" y="213" text-anchor="middle" class="small">validate + UUID</text><text x="760" y="237" text-anchor="middle" class="small">write QUEUED</text><text x="760" y="261" text-anchor="middle" class="small">send SQS message</text><path class="flow" d="M565 218H635"/>
<rect class="data" x="980" y="110" width="250" height="120"/><text x="1105" y="151" text-anchor="middle" class="label">DynamoDB</text><text x="1105" y="182" text-anchor="middle" class="small">id · email · names</text><text x="1105" y="206" text-anchor="middle" class="small">QUEUED → SENT</text><path class="flow" d="M885 180H980"/>
<rect class="data" x="980" y="300" width="250" height="120"/><text x="1105" y="341" text-anchor="middle" class="label">SQS Standard</text><text x="1105" y="372" text-anchor="middle" class="small">d-dva-sqs-email</text><text x="1105" y="396" text-anchor="middle" class="small">partial batch retry</text><path class="flow" d="M885 260H930V360H980"/>
<rect class="box" x="635" y="390" width="250" height="145"/><text x="760" y="431" text-anchor="middle" class="label">Sender Lambda</text><text x="760" y="463" text-anchor="middle" class="small">consume SQS</text><text x="760" y="487" text-anchor="middle" class="small">SES + SNS</text><text x="760" y="511" text-anchor="middle" class="small">update SENT</text><path class="flow" d="M980 390H930V460H885"/>
<rect class="ext" x="980" y="500" width="170" height="100"/><text x="1065" y="540" text-anchor="middle" class="label">SES</text><text x="1065" y="570" text-anchor="middle" class="small">registrant email</text><rect class="ext" x="1180" y="500" width="170" height="100"/><text x="1265" y="540" text-anchor="middle" class="label">SNS</text><text x="1265" y="570" text-anchor="middle" class="small">admin email</text><path class="dash" d="M885 450H980V550"/><path class="dash" d="M885 480H1180V550"/><path class="dash" d="M760 535V650H1105V230"/>
<rect class="box" x="120" y="675" width="300" height="80"/><text x="270" y="710" text-anchor="middle" class="label">IAM roles</text><text x="270" y="737" text-anchor="middle" class="small">registration policy · sender policy</text><rect class="box" x="520" y="675" width="300" height="80"/><text x="670" y="710" text-anchor="middle" class="label">CloudWatch Logs</text><text x="670" y="737" text-anchor="middle" class="small">accepted IDs · AWS errors · retries</text><rect class="box" x="920" y="675" width="300" height="80"/><text x="1070" y="710" text-anchor="middle" class="label">Hardening next</text><text x="1070" y="737" text-anchor="middle" class="small">DLQ · alarms · idempotency</text><path class="dash" d="M760 535V640H270V675"/><path class="dash" d="M760 535V640H670V675"/><path class="dash" d="M760 535V640H1070V675"/></svg>