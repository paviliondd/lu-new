<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Bank infrastructure automation lab topology</title><desc id="desc">GitLab and automation services drive AWS Terraform, Kubernetes, Containerlab FRR, and monitoring. AIOps and capacity services consume Prometheus data and expose alerts.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#fbbf24"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#fff7ed}.box{fill:#29241b;stroke:#f59e0b;stroke-width:2;rx:14}.data{fill:#183b37;stroke:#34d399;stroke-width:2;rx:14}.ops{fill:#282044;stroke:#c084fc;stroke-width:2;rx:14}.muted{fill:#cdbfa7;font-size:16px}.label{font-size:20px;font-weight:700}.small{font-size:15px}.flow{stroke:#fbbf24;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#c084fc;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1400" height="820" fill="#15130f"/><text x="55" y="50" font-size="31" font-weight="700">Bank Infrastructure Lab — automation to operations</text><text x="55" y="80" class="muted">Lab topology: Git review → safe change → infrastructure → telemetry → predictive operations.</text>
<rect class="box" x="45" y="140" width="210" height="110"/><text x="150" y="180" text-anchor="middle" class="label">GitLab / Runner</text><text x="150" y="210" text-anchor="middle" class="small">lint · validate · gates</text><rect class="box" x="325" y="140" width="210" height="110"/><text x="430" y="180" text-anchor="middle" class="label">Ansible + Vault</text><text x="430" y="210" text-anchor="middle" class="small">AWX · backups · rollback</text><path class="flow" d="M255 195H325"/>
<rect class="box" x="605" y="105" width="230" height="120"/><text x="720" y="148" text-anchor="middle" class="label">AWS Terraform</text><text x="720" y="178" text-anchor="middle" class="small">VPC · SG · EC2 AMI</text><text x="720" y="202" text-anchor="middle" class="small">staging modules</text><rect class="box" x="605" y="275" width="230" height="120"/><text x="720" y="318" text-anchor="middle" class="label">Kubernetes</text><text x="720" y="348" text-anchor="middle" class="small">kubeadm · Calico</text><text x="720" y="372" text-anchor="middle" class="small">Ingress · NFS · cert-manager</text><rect class="box" x="605" y="445" width="230" height="120"/><text x="720" y="488" text-anchor="middle" class="label">Containerlab / FRR</text><text x="720" y="518" text-anchor="middle" class="small">sw1 · sw2 · router1</text><text x="720" y="542" text-anchor="middle" class="small">172.20.20.0/24 lab</text><path class="flow" d="M535 180H605"/><path class="flow" d="M535 205H570V335H605"/><path class="flow" d="M535 225H555V505H605"/>
<rect class="data" x="930" y="140" width="240" height="115"/><text x="1050" y="180" text-anchor="middle" class="label">Bank portal</text><text x="1050" y="210" text-anchor="middle" class="small">FastAPI ×2 replicas</text><text x="1050" y="234" text-anchor="middle" class="small">TLS Ingress + metrics</text><path class="flow" d="M835 335H880V195H930"/>
<rect class="ops" x="930" y="315" width="240" height="115"/><text x="1050" y="355" text-anchor="middle" class="label">Prometheus stack</text><text x="1050" y="385" text-anchor="middle" class="small">Grafana · Alertmanager</text><text x="1050" y="409" text-anchor="middle" class="small">SNMP exporter</text><path class="dash" d="M835 505H880V375H930"/><path class="dash" d="M835 335H880V375H930"/>
<rect class="ops" x="930" y="490" width="240" height="115"/><text x="1050" y="530" text-anchor="middle" class="label">AIOps + capacity</text><text x="1050" y="560" text-anchor="middle" class="small">Isolation Forest</text><text x="1050" y="584" text-anchor="middle" class="small">LinearRegression forecast</text><path class="dash" d="M1050 430V490"/>
<rect class="box" x="1210" y="315" width="145" height="115"/><text x="1282" y="355" text-anchor="middle" class="label">CI checks</text><text x="1282" y="385" text-anchor="middle" class="small">tfsec · Trivy</text><text x="1282" y="409" text-anchor="middle" class="small">manual prod gate</text><path class="dash" d="M1170 375H1210"/>
<text x="55" y="690" class="muted">Safety flow: pre-change snapshot → validate/dry-run → apply → SSH/connectivity verify → restore on failure.</text><rect class="box" x="55" y="715" width="1300" height="42"/><text x="705" y="743" text-anchor="middle" class="small">Backup/DR: fetch FRR running config + iptables state → short-lived CI artifact → restore playbook reloads configuration.</text></svg>