<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Datxe car rental platform topology and data flow</title><desc id="desc">Browser traffic enters Nginx and reaches Next.js and NestJS. PostgreSQL stores the rental domain, Redis protects locks and OTP, storage separates public and private files, and payment and notification providers connect at the edge.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#67e8f9"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#eef7ff}.box{fill:#122840;stroke:#50a8d8;stroke-width:2;rx:14}.data{fill:#153b39;stroke:#4ade80;stroke-width:2;rx:14}.ext{fill:#392442;stroke:#e879f9;stroke-width:2;rx:14}.muted{fill:#a8bfd2;font-size:16px}.label{font-size:21px;font-weight:700}.small{font-size:16px}.flow{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#e879f9;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1400" height="820" fill="#08121f"/><text x="55" y="50" font-size="31" font-weight="700">Datxe — rental booking, payment, and operations flow</text><text x="55" y="80" class="muted">Redis reduces booking races; PostgreSQL remains authoritative for availability, money, and audit history.</text>
<rect class="box" x="45" y="150" width="180" height="100"/><text x="135" y="190" text-anchor="middle" class="label">Browser</text><text x="135" y="220" text-anchor="middle" class="small">customers · owners · staff</text><rect class="box" x="285" y="150" width="180" height="100"/><text x="375" y="190" text-anchor="middle" class="label">Nginx TLS</text><text x="375" y="220" text-anchor="middle" class="small">80/443 · rate limits</text><path class="flow" d="M225 200H285"/>
<rect class="box" x="525" y="105" width="190" height="90"/><text x="620" y="143" text-anchor="middle" class="label">Next.js</text><text x="620" y="172" text-anchor="middle" class="small">catalogue + dashboards</text><rect class="box" x="525" y="225" width="190" height="90"/><text x="620" y="263" text-anchor="middle" class="label">NestJS API</text><text x="620" y="292" text-anchor="middle" class="small">domain + auth + roles</text><path class="flow" d="M465 180H505"/><path class="flow" d="M465 220H505"/>
<rect class="data" x="820" y="115" width="250" height="135"/><text x="945" y="155" text-anchor="middle" class="label">PostgreSQL / Prisma</text><text x="945" y="187" text-anchor="middle" class="small">vehicles · bookings · payments</text><text x="945" y="212" text-anchor="middle" class="small">contracts · audit · revenue</text><path class="flow" d="M715 260H770V185H820"/>
<rect class="data" x="820" y="315" width="250" height="135"/><text x="945" y="355" text-anchor="middle" class="label">Redis 7</text><text x="945" y="387" text-anchor="middle" class="small">OTP · rate limits</text><text x="945" y="412" text-anchor="middle" class="small">vehicle locks · dedupe</text><path class="flow" d="M715 280H785V380H820"/>
<rect class="data" x="820" y="515" width="250" height="110"/><text x="945" y="553" text-anchor="middle" class="label">VPS storage</text><text x="945" y="583" text-anchor="middle" class="small">public vehicle images</text><text x="945" y="606" text-anchor="middle" class="small">private CCCD / GPLX files</text><path class="flow" d="M715 300H760V570H820"/>
<rect class="ext" x="1140" y="115" width="210" height="100"/><text x="1245" y="153" text-anchor="middle" class="label">PayOS / MoMo</text><text x="1245" y="183" text-anchor="middle" class="small">signed callbacks</text><rect class="ext" x="1140" y="265" width="210" height="100"/><text x="1245" y="303" text-anchor="middle" class="label">SES / SNS</text><text x="1245" y="333" text-anchor="middle" class="small">email + SMS</text><rect class="ext" x="1140" y="415" width="210" height="100"/><text x="1245" y="453" text-anchor="middle" class="label">Socket.IO</text><text x="1245" y="483" text-anchor="middle" class="small">JWT chat rooms</text><path class="dash" d="M1070 170H1140"/><path class="dash" d="M1070 210H1110V315H1140"/><path class="dash" d="M1070 410H1110V465H1140"/>
<rect class="box" x="55" y="665" width="300" height="95"/><text x="205" y="704" text-anchor="middle" class="label">GitHub Actions</text><text x="205" y="734" text-anchor="middle" class="small">test → SHA images → deploy</text><rect class="box" x="430" y="665" width="300" height="95"/><text x="580" y="704" text-anchor="middle" class="label">Docker Compose</text><text x="580" y="734" text-anchor="middle" class="small">migrations · readiness · rollback</text><rect class="box" x="805" y="665" width="300" height="95"/><text x="955" y="704" text-anchor="middle" class="label">Audit / health</text><text x="955" y="734" text-anchor="middle" class="small">AuditLog · NotificationLog</text><path class="dash" d="M205 665V640H580V665"/><path class="dash" d="M580 665V640H955V665"/>
</svg>